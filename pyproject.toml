[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worksisyphus"
version = "2.1.0"
description = "Simon Chen's resume compiler: hand-written slug plans in, one-page LaTeX PDFs out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "libsql-experimental>=0.0.55",
]

[project.scripts]
worksisyphus = "worksisyphus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0"
]
