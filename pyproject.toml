[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worksisyphus"
version = "0.1.0"
description = "Simon Chen's resumes compilation tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.40.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0"
]
